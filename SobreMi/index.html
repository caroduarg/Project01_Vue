<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Sobre Mi</h1>
    </header>
    <section id="about">
        <h2>Informacion Personal</h2>
        <p>Nombre: {{ nombre }}</p>
        <p>Apellido: {{ apellido }}</p>
        <p>Edad: {{ edad }}</p>
        <p>Calculo de mi Edad en 5 Años: {{ In5Years() }}</p>
        <p>Mi Pelicula Favorita: {{ peliculaFavorita }}</p>
        <p>Mi Numero Favorito: {{ changeNumber() }}</p>
    </section>
</body>

</html>
